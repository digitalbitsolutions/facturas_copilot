name: Deploy Azure Function

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment name
        required: true
        default: dev
      location:
        description: Azure region
        required: true
        default: spaincentral

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Ensure resource group
        run: az group create --name "rg-facturas-copilot-${{ inputs.environment }}" --location "${{ inputs.location }}"
      - name: Deploy infrastructure
        id: infra
        shell: bash
        run: |
          output=$(az deployment group create \
            --resource-group "rg-facturas-copilot-${{ inputs.environment }}" \
            --template-file infra/main.bicep \
            --parameters environmentName="${{ inputs.environment }}" location="${{ inputs.location }}" entraApiClientId="${{ vars.ENTRA_API_CLIENT_ID }}" \
            --query properties.outputs.functionAppName.value -o tsv)
          echo "function_name=$output" >> "$GITHUB_OUTPUT"
      - name: Prepare deployment package
        run: npm prune --omit=dev
      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ steps.infra.outputs.function_name }}
          package: .
