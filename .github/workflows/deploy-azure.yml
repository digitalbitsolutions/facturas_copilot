name: Deploy Azure Function

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment name
        required: true
        default: dev
      location:
        description: Azure region
        required: true
        default: spaincentral
      document_intelligence_location:
        description: Azure Document Intelligence region
        required: true
        default: northeurope
      m365_mailbox_address:
        description: SMTP address of the mailbox dedicated to invoice intake in this environment
        required: true
        type: string
      m365_mail_folder:
        description: Root-level mailbox folder that contains invoices approved for automated processing
        required: true
        type: string
        default: Facturas Copilot
      m365_sharepoint_site_id:
        description: Microsoft Graph composite ID of the private SharePoint site
        required: true
        type: string
      m365_sharepoint_drive_id:
        description: Microsoft Graph ID of the document library (starts with b!)
        required: true
        type: string
      invoice_processing_enabled:
        description: Enable automatic processing only after SharePoint state lists are ready
        required: true
        type: boolean
        default: false
      invoice_processing_not_before:
        description: Process only messages received at or after this UTC ISO instant
        required: true
        default: '9999-12-31T23:59:59Z'
      bank_import_profile:
        description: Versioned bank-import profile (standard-es-v1 or bankinter-simulated-csv-v1)
        required: true
        default: standard-es-v1
      payment_forecast_import_enabled:
        description: Enable scheduled payment-forecast import only after controlled validation
        required: true
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Ensure resource group
        run: az group create --name "rg-facturas-copilot-${{ inputs.environment }}" --location "${{ inputs.location }}"
      - name: Deploy infrastructure
        id: infra
        shell: bash
        run: |
          output=$(az deployment group create \
            --resource-group "rg-facturas-copilot-${{ inputs.environment }}" \
            --template-file infra/main.bicep \
            --parameters environmentName="${{ inputs.environment }}" location="${{ inputs.location }}" documentIntelligenceLocation="${{ inputs.document_intelligence_location }}" entraApiClientId="${{ vars.ENTRA_API_CLIENT_ID }}" m365MailboxAddress="${{ inputs.m365_mailbox_address }}" m365MailFolder="${{ inputs.m365_mail_folder }}" m365SharePointSiteId="${{ inputs.m365_sharepoint_site_id }}" m365SharePointDriveId="${{ inputs.m365_sharepoint_drive_id }}" invoiceProcessingEnabled="${{ inputs.invoice_processing_enabled }}" invoiceProcessingNotBefore="${{ inputs.invoice_processing_not_before }}" bankImportProfile="${{ inputs.bank_import_profile }}" paymentForecastImportEnabled="${{ inputs.payment_forecast_import_enabled }}" \
            --query properties.outputs.functionAppName.value -o tsv)
          echo "function_name=$output" >> "$GITHUB_OUTPUT"
      - name: Prepare deployment package
        run: npm prune --omit=dev
      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ steps.infra.outputs.function_name }}
          package: .
